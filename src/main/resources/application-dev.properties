spring.application.name=tech_cup
logging.file.name=logs/tech-cup.log

# PostgreSQL Configuration (ignored if datasource is not available)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=2000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# MongoDB Configuration for Image Storage
spring.data.mongodb.uri=mongodb://localhost:27017/tech_cup_images
spring.data.mongodb.auto-index-creation=true
